<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="校時">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1a" media="(prefers-color-scheme: dark)">
<title>校時カレンダー</title>
<style>
:root{
  --bg:#ffffff; --fg:#1f1f1d; --sub:#6b6a65; --muted:#a3a29b; --line:#e4e2da; --empty:#f3f2ed;
  --today:#fff6d6;
  --tt-bg:#e1f5ee; --tt-fg:#085041;
  --c0-bg:#faece7; --c0-fg:#712b13;
  --c1-bg:#e6f1fb; --c1-fg:#0c447c;
  --c2-bg:#fbeaf0; --c2-fg:#72243e;
  --hol-bg:#eeedfe; --hol-fg:#3c3489;
  --work:#e3ebf5;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1c1c1a; --fg:#ecebe6; --sub:#a3a29b; --muted:#6b6a65; --line:#3a3936; --empty:#262624;
    --today:#3a3320;
    --tt-bg:#085041; --tt-fg:#e1f5ee;
    --c0-bg:#712b13; --c0-fg:#faece7;
    --c1-bg:#0c447c; --c1-fg:#e6f1fb;
    --c2-bg:#72243e; --c2-fg:#fbeaf0;
    --hol-bg:#3c3489; --hol-fg:#eeedfe;
    --work:#2b3443;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;-webkit-text-size-adjust:100%}
body{padding:calc(env(safe-area-inset-top) + 8px) 6px calc(env(safe-area-inset-bottom) + 72px)}
main{max-width:760px;margin:0 auto;overflow-x:clip}
#weeks{touch-action:pan-y;position:relative}
.peek{position:absolute;top:0;width:100%}
header{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
header h1{font-size:14px;font-weight:600;margin:0 0 0 2px}
#gear{margin-right:auto;border:none;color:var(--sub);padding:5px 6px}
button{font:inherit;font-size:12px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer}
button:active{transform:scale(.97)}
#status{font-size:10px;color:var(--sub);margin:0 2px 8px;min-height:13px}
#status.err{color:#c0392b}
details#settings{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:12px}
details#settings summary{display:none}
details#settings:not([open]){display:none}
details#settings label{display:block;margin:8px 0 2px;color:var(--sub)}
details#settings input{width:100%;font:inherit;font-size:14px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
details#settings p{color:var(--sub);font-size:11px;margin:8px 0}
.week{display:grid;grid-template-columns:30px minmax(0,.5fr) repeat(5,minmax(0,1fr)) minmax(0,.5fr);gap:2px;margin-bottom:14px;font-size:10px}
.lab{color:var(--sub);text-align:right;padding-right:3px;display:flex;flex-direction:column;justify-content:center;line-height:1.1}
.lab small{font-size:9px;color:var(--muted)}
.dh{text-align:center;line-height:1.2;padding:2px 0;border-radius:4px}
.dh.we{color:var(--muted)}
.dh.today{background:var(--today);font-weight:600}
.dh.hol{color:var(--hol-fg)}
.cell{border-radius:4px;min-height:44px;background:var(--empty);display:flex;flex-direction:column;gap:1px;overflow:hidden;cursor:pointer}
.cell.we{background:transparent;border:1px dashed var(--line)}
.cell.short{min-height:14px}
.cell.bottom{justify-content:flex-end}
.cell.bottom .it{flex:none}
.cell.ad{background:transparent;min-height:14px;cursor:default}
.cell.ad{cursor:pointer}
.cell.today{outline:1.5px solid var(--today)}
.it{flex:1;border-radius:3px;padding:1px 2px;display:flex;flex-direction:column;justify-content:center;text-align:center;line-height:1.15;word-break:break-all;overflow:hidden}
.it.tt{background:var(--tt-bg);color:var(--tt-fg)}
.it .one{display:block;white-space:nowrap;overflow:hidden;font-size:9px}
.week.loading .it{opacity:.55}
.it.c0{background:var(--c0-bg);color:var(--c0-fg)}
.it.c1{background:var(--c1-bg);color:var(--c1-fg)}
.it.c2{background:var(--c2-bg);color:var(--c2-fg)}
.it.hol{background:var(--hol-bg);color:var(--hol-fg)}
.it.dim{opacity:.4}
.it.cont{flex:0 0 6px}
.ad .it{flex:none;padding:1px 2px}
.wk{flex:none;font-size:8px;color:var(--sub);text-align:center;line-height:1.3}
.cell.hour{min-height:22px}
.cell.work{background:var(--work)}
.lab.tog{cursor:pointer;color:var(--fg)}
.lab.tog small{color:var(--sub)}
.legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:10px;color:var(--sub);margin:4px 0 12px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:-1px;background:var(--sw)}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(env(safe-area-inset-bottom) + 12px);font-size:13px;display:none;max-height:45vh;overflow:auto;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
#sheet.open{display:block}
#sheet h2{font-size:13px;margin:0 0 6px;display:flex;justify-content:flex-start;align-items:center;gap:10px}
#sheet ul{list-style:none;margin:0;padding:0}
#sheet li{padding:5px 0;border-top:1px solid var(--line)}
#sheet li small{color:var(--sub);display:block;font-size:11px}
#sheet-add{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#sheet-add a{font-size:12px;color:var(--fg);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:5px 9px}
</style>
</head>
<body>
<main>
  <header>
    <h1>校時カレンダー</h1>
    <button id="gear" aria-label="設定">⚙</button>
    <button id="prev" aria-label="前の週">◀</button>
    <button id="today">今週</button>
    <button id="next" aria-label="次の週">▶</button>
    <button id="reload">更新</button>
  </header>
  <div id="status"></div>
  <details id="settings">
    <summary>設定</summary>
    <label for="url">GAS の Web アプリの URL</label>
    <input id="url" type="url" autocomplete="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
    <label for="token">合言葉</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false">
    <label for="accounts">予定を追加するアカウント（任意。メールアドレスをカンマで区切る）</label>
    <input id="accounts" type="text" autocomplete="off" spellcheck="false">
    <p>どれも、この機械のブラウザにだけ覚えさせます。URL と合言葉は GAS を呼ぶときに付けるだけ、アカウントは Google カレンダーの作成画面を開くときに付けるだけです。アカウントが空なら、ブラウザで今ログインしているアカウントで開きます。</p>
    <button id="save">保存して読み込む</button>
  </details>
  <div id="legend" class="legend"></div>
  <div id="weeks"></div>
</main>
<div id="sheet"><h2><button id="sheet-close">閉じる</button><span id="sheet-title"></span></h2><ul id="sheet-list"></ul><div id="sheet-add"></div></div>
<script>
const WEEKS = 1;
const W = ['日','月','火','水','木','金','土'];
const SAMPLE = new URLSearchParams(location.search).has('sample');
const store = {
  get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} },
};
const $ = id => document.getElementById(id);
let offset = 0;
let slideDir = 0;
const MOTION = !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

function dayOf(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function sundayOf(d){ return addDays(dayOf(d), -d.getDay()); }
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function parseYmd(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function toMin(s){ const m = /^(\d{1,2}):(\d{2})/.exec(s || ''); return m ? (+m[1])*60 + (+m[2]) : null; }
function hm(d){ return d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0'); }
function md(d){ return (d.getMonth()+1) + '/' + d.getDate(); }
function push(obj, key, v){ (obj[key] = obj[key] || []).push(v); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function startDate(){ return addDays(sundayOf(new Date()), offset * 7); }

let openEarly = store.get('gc:early') === '1';
let openLate = store.get('gc:late') === '1';
function fmtMin(m){ return Math.floor(m/60) + ':' + String(m%60).padStart(2,'0'); }
function hourRows(from, to){
  const a = [];
  for (let m = from; m < to; ) {
    const n = Math.min(to, (Math.floor(m/60) + 1) * 60);
    a.push({ name: Math.floor(m/60) + '時', s: m, e: n, start: fmtMin(m), end: fmtMin(n), kind: 'hour' });
    m = n;
  }
  return a;
}

// 朝〜放課後は時程の校時。その前（0 時〜）と放課後のあとは畳んでおき、開くと 1 時間ごとの段にする
function buildRows(periods){
  const rows = periods.map(p => ({ name: p.name, s: toMin(p.start), e: toMin(p.end), start: p.start, end: p.end }));
  rows.forEach((r, i) => { if (r.e == null) r.e = (rows[i+1] && rows[i+1].s != null) ? rows[i+1].s : 24*60; });
  rows.forEach((r, i) => { if (r.s == null) r.s = i > 0 ? rows[i-1].e : 0; });
  if (!rows.length) return rows;
  const last = rows[rows.length - 1];
  last.after = true;
  last.fold = 'late';
  if (openLate) {
    if (last.e === 24*60) { last.e = Math.min(24*60, (Math.floor(last.s/60) + 1) * 60); last.end = fmtMin(last.e); }
    rows.push(...hourRows(last.e, 24*60).map(r => Object.assign(r, { late: true })));
  }
  const first = rows[0];
  if (first.s > 0) {
    if (openEarly) {
      const h = hourRows(0, first.s);
      h[0].fold = 'early';
      rows.unshift(...h);
    } else {
      rows.unshift({ name: '0時〜', s: 0, e: first.s, start: '0:00', end: first.start, kind: 'fold', fold: 'early' });
    }
  }
  return rows;
}

const CAL_COLOR = { '学校': 'c0', '個人': 'c1' };
// 学校の終日の予定の頭の「10)」などで、その日の勤務の終わりが決まる
const WORK_END = { 6: '15:15', 8: '17:15', 10: '19:15' };
function workCode(ev){
  if (ev.cal !== '学校' || !ev.allDay) return null;
  const t = String(ev.title).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  const m = /^\s*(\d{1,2})\s*[)）]\s*/.exec(t);
  if (!m || !WORK_END[+m[1]]) return null;
  return { end: WORK_END[+m[1]], rest: String(ev.title).slice(m[0].length).trim() };
}
function calClass(label, map){
  if (label === '祝日') return 'hol';
  map[label] = CAL_COLOR[label] || 'c2';
  return map[label];
}

const HALF = s => String(s).replace(/[０-９（），．]/g, c => ({ '（':'(', '）':')', '，':',', '．':'.' }[c] || String.fromCharCode(c.charCodeAt(0) - 0xFEE0)));
// 終日の予定の中身を、括弧の外の読点・カンマで分ける（「5,6限」の括弧の中は分けない）
function splitItems(t){ return HALF(t).split(/[、,](?![^()]*\))/).map(x => x.trim()).filter(Boolean); }
// 「(5限)」「(5,6限)」「(4限目)」→ ['5','6']。「(放課後)」→ ['放課後']
function parenSlots(item){
  const m = /\(([^()]*)\)/.exec(item);
  if (!m) return null;
  if (/放課後/.test(m[1])) return ['放課後'];
  if (!/限/.test(m[1])) return null;
  const n = m[1].match(/\d+/g);
  return n && n.length ? n : null;
}
function rowIndex(rows, slot){
  if (slot === '放課後') return rows.findIndex(r => r.after);
  return rows.findIndex(r => !r.kind && (r.name === slot || r.name === slot + '限'));
}
// その日に使う時程の種類（学校の終日の予定に「考査」などが入っていれば、その言葉）
function dayTypes(data){
  const kinds = [...new Set((data.periods || []).flatMap(p => Object.keys(p.alt || {})))];
  const out = {};
  if (!kinds.length) return out;
  data.events.forEach(ev => {
    if (ev.cal !== '学校' || !ev.allDay) return;
    const k = kinds.find(x => String(ev.title).includes(x));
    if (!k) return;
    for (let d = parseYmd(ev.start), end = parseYmd(ev.end); d < end; d = addDays(d, 1)) out[ymd(d)] = k;
  });
  return out;
}
// 時程の種類が違う日だけ、段の時刻をその種類のものに置き換える（段の並びは週で揃えたまま）
function rowsForType(data, rows, type){
  const alt = {};
  (data.periods || []).forEach(p => { if (p.alt && p.alt[type]) alt[p.name] = p.alt[type]; });
  return rows.map(r => {
    const a = !r.kind && alt[r.name];
    if (!a) return r;
    const s = toMin(a.start), e = toMin(a.end);
    return Object.assign({}, r, { s: s != null ? s : r.s, e: e != null ? e : r.e, start: a.start || r.start, end: a.end || r.end });
  });
}

function place(data, rows){
  const allDay = {}, timed = {}, calMap = {}, work = {};
  const types = dayTypes(data), dayRows = {};
  Object.entries(types).forEach(([k, t]) => { dayRows[k] = rowsForType(data, rows, t); });
  const rowsOf = k => dayRows[k] || rows;
  const extra = [];
  data.events.forEach(ev => {
    ev.cls = calClass(ev.cal, calMap);
    const wc = workCode(ev);
    if (wc) {
      for (let d = parseYmd(ev.start), end = parseYmd(ev.end); d < end; d = addDays(d, 1)) work[ymd(d)] = wc.end;
      if (!wc.rest) return;
      ev = Object.assign({}, ev, { title: wc.rest });
    }
    if (ev.allDay && ev.cal === '学校') {
      splitItems(ev.title).forEach(item => {
        const slots = parenSlots(item);
        const name = item.replace(/\([^()]*\)/g, '').trim() || item;
        for (let d = parseYmd(ev.start), end = parseYmd(ev.end); d < end; d = addDays(d, 1)) {
          const k = ymd(d);
          if (slots) {
            const idx = slots.map(sl => rowIndex(rowsOf(k), sl)).filter(i => i >= 0);
            idx.forEach((i, n) => {
              timed[k] = timed[k] || {};
              push(timed[k], i, { ev: Object.assign({}, ev, { title: name, allDay: false, label: item.match(/\(([^()]*)\)/)[1] + '（終日の予定から）' }), first: n === 0 });
            });
            continue;
          }
          const mt = (data.meetings || []).find(m => m.name && item.includes(m.name));
          const ms = mt ? toMin(mt.start) : null;
          if (ms == null) continue;
          const me = toMin(mt.end) != null ? toMin(mt.end) : ms + 60;
          const at = m => { const x = new Date(d); x.setHours(0, m, 0, 0); return x.toISOString(); };
          extra.push(Object.assign({}, ev, { title: name, allDay: false, start: at(ms), end: at(me), fromMeeting: true }));
        }
      });
    }
    if (ev.allDay) {
      for (let d = parseYmd(ev.start), end = parseYmd(ev.end); d < end; d = addDays(d, 1)) push(allDay, ymd(d), ev);
      return;
    }
    placeTimed(ev);
  });
  extra.forEach(placeTimed);
  function placeTimed(ev){
    const s = new Date(ev.start);
    let e = new Date(ev.end);
    if (e <= s) e = new Date(s.getTime() + 60000);
    ev.label = hm(s) + '〜' + hm(e) + (ev.fromMeeting ? '（会議のシートの時刻）' : '');
    let first = true;
    const last = dayOf(new Date(e.getTime() - 1));
    for (let d = dayOf(s); d <= last; d = addDays(d, 1)) {
      const base = d.getTime();
      const sm = Math.max(0, (s - base) / 60000), em = Math.min(1440, (e - base) / 60000);
      const k = ymd(d);
      const rs = rowsOf(k);
      let hit = [];
      rs.forEach((r, i) => { if (sm < r.e && em > r.s) hit.push(i); });
      if (!hit.length) {
        let j = 0;
        rs.forEach((r, i) => { if (r.s <= sm) j = i; });
        hit = [j];
      }
      timed[k] = timed[k] || {};
      hit.forEach(i => { push(timed[k], i, { ev, first }); first = false; });
    }
  }
  return { allDay, timed, calMap, work, types, rowsOf };
}

let lastData = null;
let shown = null;

function render(data, loading, target){
  if (!target) {
    if (!loading) lastData = data;
    shown = { data, loading };
  }
  const rows = buildRows(data.periods);
  const { allDay, timed, calMap, work, types, rowsOf } = place(data, rows);
  const tt = {};
  data.timetable.forEach(t => { tt[t.day + '|' + t.period] = t; });
  const start = parseYmd(data.start);
  const todayKey = ymd(new Date());
  const box = target || $('weeks');
  box.innerHTML = '';

  const lg = ['<span style="--sw:var(--tt-bg)">授業</span>'];
  Object.entries(calMap).forEach(([label, c]) => lg.push('<span style="--sw:var(--' + c + '-bg)">' + esc(label) + '</span>'));
  if (data.events.some(e => e.cal === '祝日')) lg.push('<span style="--sw:var(--hol-bg)">祝日</span>');
  if (!target) $('legend').innerHTML = lg.join('');

  for (let w = 0; w < data.days / 7; w++) {
    const g = document.createElement('div');
    g.className = 'week' + (loading ? ' loading' : '');
    const dates = [];
    for (let i = 0; i < 7; i++) dates.push(addDays(start, w*7 + i));
    const keys = dates.map(ymd);
    const hol = keys.map(k => (allDay[k] || []).some(e => e.cal === '祝日'));

    g.appendChild(document.createElement('div'));
    dates.forEach((d, i) => {
      const h = document.createElement('div');
      const we = i === 0 || i === 6;
      h.className = 'dh' + (we ? ' we' : '') + (keys[i] === todayKey ? ' today' : '') + (hol[i] ? ' hol' : '');
      h.innerHTML = (we ? d.getDate() : md(d)) + '<br>' + W[i];
      g.appendChild(h);
    });

    const adl = document.createElement('div');
    adl.className = 'lab';
    adl.textContent = '終日';
    g.appendChild(adl);
    keys.forEach((k, i) => {
      const c = document.createElement('div');
      c.className = 'cell ad';
      const evs = allDay[k] || [];
      if (evs.length) {
        c.classList.add('has');
        c.innerHTML = evs.map(e => '<div class="it ' + e.cls + '">' + esc(e.title) + '</div>').join('');
      }
      bind(c, dates[i], '終日', evs.map(e => ({ title: e.title, sub: '終日・' + e.cal })), { allDay: true });
      g.appendChild(c);
    });

    rows.forEach((r, ri) => {
      const l = document.createElement('div');
      l.className = 'lab';
      if (r.fold) {
        const open = r.fold === 'early' ? openEarly : openLate;
        l.classList.add('tog');
        l.innerHTML = esc(r.name) + '<small>' + (r.kind === 'hour' ? '' : esc(r.start) + ' ') + (open ? '▾' : '▸') + '</small>';
        l.addEventListener('click', () => toggle(r.fold));
      } else {
        l.innerHTML = esc(r.name) + (r.start && r.kind !== 'hour' ? '<small>' + esc(r.start) + '</small>' : '');
      }
      g.appendChild(l);
      const short = r.kind === 'fold' || r.name.startsWith('昼') || (r.kind !== 'hour' && r.e - r.s <= 20);
      keys.forEach((k, i) => {
        const dr = rowsOf(k)[ri];
        const c = document.createElement('div');
        const we = i === 0 || i === 6;
        c.className = 'cell' + (we ? ' we' : '') + (short ? ' short' : '') + (r.name === '朝' ? ' bottom' : '') + (r.kind === 'hour' ? ' hour' : '') + (k === todayKey ? ' today' : '');
        if ((r.after || r.late) && work[k] && r.s < toMin(work[k])) c.classList.add('work');
        const items = [], detail = [];
        const wEnd = work[k] ? toMin(work[k]) : null;
        if ((r.after || r.late) && wEnd != null && ((wEnd >= r.s && (wEnd < r.e || r.e === 24*60)) || (r.after && wEnd < r.s))) {
          items.push('<div class="wk">勤務〜' + esc(work[k]) + '</div>');
          detail.push({ title: '勤務は ' + work[k] + ' まで', sub: '学校の終日の予定から' });
        }
        const t = (hol[i] || types[k] || r.kind) ? null : tt[i + '|' + r.name];
        if (t) {
          items.push('<div class="it tt"><span class="one">' + esc((t.cls ? t.cls + ' ' : '') + t.subject) + '</span></div>');
          detail.push({ title: (t.cls ? t.cls + ' ' : '') + t.subject, sub: '授業' });
        }
        ((timed[k] || {})[ri] || []).forEach(({ ev, first }) => {
          items.push('<div class="it ' + ev.cls + (first ? '' : ' cont') + '">' + (first ? esc(ev.title) : '') + '</div>');
          detail.push({ title: ev.title, sub: ev.label + '・' + ev.cal });
        });
        c.innerHTML = items.join('');
        const time = dr.start ? dr.start + (dr.end ? '〜' + dr.end : '〜') : '';
        bind(c, dates[i], r.name + (/^\d+$/.test(r.name) ? '限' : '') + (time ? ' ' + time : '') + (types[k] && dr !== r ? '（' + types[k] + 'の時程）' : ''), detail, { s: dr.s, e: (dr.kind === 'fold' || dr.after) ? Math.min(dr.e, dr.s + 60) : dr.e });
        g.appendChild(c);
      });
    });
    box.appendChild(g);
  }
  box.querySelectorAll('.one').forEach(fit);
  if (!target && slideDir) {
    const d = slideDir;
    slideDir = 0;
    box.style.transform = '';
    if (MOTION && box.animate) box.animate([{ transform: 'translateX(' + (d * 100) + '%)', opacity: 0.3 }, { transform: 'none', opacity: 1 }], { duration: 240, easing: 'cubic-bezier(.2,.75,.3,1)' });
  }
}

function go(n, noSlide){
  if (!n) return;
  offset += n;
  slideDir = noSlide ? 0 : (n > 0 ? 1 : -1);
  $('sheet').classList.remove('open');
  load(false);
  if (slideDir) { slideDir = 0; $('weeks').style.transform = ''; }
}

function toggle(which){
  if (which === 'early') { openEarly = !openEarly; store.set('gc:early', openEarly ? '1' : '0'); }
  else { openLate = !openLate; store.set('gc:late', openLate ? '1' : '0'); }
  if (shown) render(shown.data, shown.loading);
}

function fit(el){
  let size = 9;
  el.style.fontSize = size + 'px';
  while (el.scrollWidth > el.clientWidth && size > 6) { size -= 0.5; el.style.fontSize = size + 'px'; }
  if (el.scrollWidth > el.clientWidth) el.style.whiteSpace = 'normal';
}

// Google カレンダーの作成画面を、日時を入れて開く（書き込みの権限は渡さない。保存は作成画面で人がする）
function stamp(date, min){
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, min);
  return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0')
    + 'T' + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0') + '00';
}
function addLinks(date, range){
  const dates = range.allDay
    ? ymd(date).replace(/-/g, '') + '/' + ymd(addDays(date, 1)).replace(/-/g, '')
    : stamp(date, range.s) + '/' + stamp(date, range.e);
  const base = 'https://calendar.google.com/calendar/render?action=TEMPLATE&ctz=Asia%2FTokyo&dates=' + dates;
  const accts = (store.get('gc:accounts') || '').split(',').map(s => s.trim()).filter(Boolean);
  if (!accts.length) return '<a href="' + base + '" target="_blank" rel="noopener">＋ 予定を追加</a>';
  return accts.map(a => '<a href="' + base + '&authuser=' + encodeURIComponent(a) + '" target="_blank" rel="noopener">＋ ' + esc(a.split('@')[0]) + '</a>').join('');
}
function bind(el, date, slot, detail, range){
  el.addEventListener('click', () => {
    $('sheet-title').textContent = md(date) + '（' + W[date.getDay()] + '） ' + slot;
    $('sheet-list').innerHTML = detail.length
      ? detail.map(d => '<li>' + esc(d.title) + '<small>' + esc(d.sub) + '</small></li>').join('')
      : '<li>空き</li>';
    $('sheet-add').innerHTML = range ? addLinks(date, range) : '';
    $('sheet').classList.add('open');
  });
}

function status(msg, err){ const s = $('status'); s.textContent = msg; s.className = err ? 'err' : ''; }

function cacheKey(start){ return 'gc1:' + ymd(start); }

function prune(){
  try {
    const keep = ymd(addDays(sundayOf(new Date()), -28));
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (/^gc:\d{4}-\d{2}-\d{2}$/.test(k)) localStorage.removeItem(k);
      else if (/^gc1:\d{4}-\d{2}-\d{2}$/.test(k) && k.slice(4) < keep) localStorage.removeItem(k);
    }
  } catch (e) {}
}

async function load(fresh){
  const start = startDate();
  const cached = SAMPLE ? null : store.get(cacheKey(start));
  if (cached && !fresh) {
    try { const d = JSON.parse(cached); render(d); status('前に取った分を表示中（' + when(d.generated) + '）… 読み込んでいます'); } catch (e) {}
  } else {
    if (lastData && !fresh) render(Object.assign({}, lastData, { start: ymd(start), events: [] }), true);
    status('読み込み中…');
  }
  try {
    const data = SAMPLE ? sampleData(start) : await fetchData(start, fresh);
    if (data.error) throw new Error(data.error === 'unauthorized' ? '合言葉が合いません。設定を見てください' : data.error);
    if (!SAMPLE) { store.set(cacheKey(start), JSON.stringify(data)); prune(); }
    if (startDate().getTime() !== start.getTime()) return;
    render(data);
    status((SAMPLE ? '試しのデータ・' : '') + when(data.generated) + ' 時点' + (data.warnings && data.warnings.length ? '（注意: ' + data.warnings.join(' / ') + '）' : ''));
    prefetch(start);
  } catch (e) {
    if (startDate().getTime() !== start.getTime()) return;
    status((cached ? '新しい分を取れませんでした（前に取った分を表示中）: ' : '読み込めませんでした: ') + e.message, true);
  }
}

async function prefetch(start){
  if (SAMPLE) return;
  for (const n of [7, -7]) {
    const s = addDays(start, n);
    if (store.get(cacheKey(s))) continue;
    try { const d = await fetchData(s, false); if (!d.error) store.set(cacheKey(s), JSON.stringify(d)); } catch (e) {}
  }
}

async function fetchData(start, fresh){
  const url = store.get('gc:url'), token = store.get('gc:token');
  if (!url || !token) { $('settings').open = true; throw new Error('設定で GAS の URL と合言葉を入れてください'); }
  const q = new URLSearchParams({ token, start: ymd(start), weeks: String(WEEKS) });
  if (fresh) q.set('fresh', '1');
  const res = await fetch(url + (url.includes('?') ? '&' : '?') + q.toString());
  if (!res.ok) throw new Error('GAS が ' + res.status + ' を返しました');
  return res.json();
}

function when(iso){ if (!iso) return ''; const d = new Date(iso); return md(d) + ' ' + hm(d); }

function sampleData(start){
  const periods = [['朝','8:30','8:50'],['1','8:50','9:40'],['2','9:50','10:40'],['3','10:50','11:40'],['4','11:50','12:40'],['昼','12:40','13:25'],['5','13:25','14:15'],['6','14:25','15:15'],['終礼','15:15','15:30'],['放課後','15:30','']]
    .map(([name, s, e]) => ({ name, start: s, end: e }));
  const exam = { '1': ['8:50','9:40'], '2': ['9:55','10:45'], '3': ['11:00','11:50'], '4': ['12:05','12:55'] };
  periods.forEach(p => { if (exam[p.name]) p.alt = { '考査': { start: exam[p.name][0], end: exam[p.name][1] } }; });
  const meetings = [{ name: '職員会議', start: '16:00', end: '17:00' }];
  const timetable = [
    [1,'1','3-3','美術1'],[1,'3','3-1','美術1'],[1,'6','選択3年','美術'],
    [2,'2','2-1','美術1'],[2,'4','3-3','美術1'],[2,'5','選択1年','eスポーツ'],
    [3,'1','3-1','美術1'],[3,'6','2-1','美術1'],
    [4,'2','選択3年','美術'],[4,'5','3-3','美術1'],[4,'6','選択1年','eスポーツ'],
    [5,'3','2-1','美術1'],[5,'4','3-1','美術1'],
  ].map(([day, period, cls, subject]) => ({ day, period, cls, subject }));
  const at = (n, h, m) => { const d = addDays(start, n); d.setHours(h, m); return d.toISOString(); };
  const events = [
    { cal: '学校', title: '職員朝礼', allDay: false, start: at(1, 8, 30), end: at(1, 8, 40) },
    { cal: '学校', title: '試験監督', allDay: false, start: at(2, 9, 55), end: at(2, 10, 45) },
    { cal: '学校', title: '学年集会', allDay: false, start: at(4, 14, 25), end: at(4, 15, 15) },
    { cal: '学校', title: '来客', allDay: false, start: at(2, 9, 40), end: at(2, 9, 50) },
    { cal: '学校', title: '研修', allDay: false, start: at(2, 9, 50), end: at(2, 12, 40) },
    { cal: '個人', title: '歯医者', allDay: false, start: at(6, 10, 0), end: at(6, 11, 0) },
    { cal: '個人', title: 'ジム', allDay: false, start: at(4, 20, 0), end: at(4, 21, 30) },
    { cal: '個人', title: '早朝の用事', allDay: false, start: at(5, 6, 30), end: at(5, 7, 30) },
    { cal: '学校', title: '6) 期末考査①', allDay: true, start: ymd(addDays(start, 2)), end: ymd(addDays(start, 3)) },
    { cal: '学校', title: '10) 職員会議、学年の行事(5,6限)', allDay: true, start: ymd(addDays(start, 3)), end: ymd(addDays(start, 4)) },
    { cal: '学校', title: '8)', allDay: true, start: ymd(addDays(start, 4)), end: ymd(addDays(start, 5)) },
    { cal: '学校', title: '８）模試', allDay: true, start: ymd(addDays(start, 5)), end: ymd(addDays(start, 6)) },
    { cal: '祝日', title: '祝日の例', allDay: true, start: ymd(addDays(start, 1)), end: ymd(addDays(start, 2)) },
  ];
  return { generated: new Date().toISOString(), start: ymd(start), days: WEEKS * 7, periods, meetings, timetable, events, warnings: [] };
}

$('url').value = store.get('gc:url') || '';
$('token').value = store.get('gc:token') || '';
$('accounts').value = store.get('gc:accounts') || '';
$('save').addEventListener('click', () => {
  store.set('gc:url', $('url').value.trim());
  store.set('gc:token', $('token').value.trim());
  store.set('gc:accounts', $('accounts').value.trim());
  $('settings').open = false;
  load(true);
});
$('prev').addEventListener('click', () => go(-1));
$('next').addEventListener('click', () => go(1));
$('today').addEventListener('click', () => { if (offset) go(-offset); else load(false); });
$('reload').addEventListener('click', () => load(true));
$('gear').addEventListener('click', () => { $('settings').open = !$('settings').open; });
$('sheet-close').addEventListener('click', () => $('sheet').classList.remove('open'));

let touch = null;
const weeksBox = $('weeks');
const GAP = 12;
function shiftCss(n){ return n > 0 ? 'translateX(calc(-100% - ' + GAP + 'px))' : 'translateX(calc(100% + ' + GAP + 'px))'; }
function neighbor(n){
  const s = addDays(startDate(), n * 7);
  if (SAMPLE) return { data: sampleData(s) };
  const c = store.get(cacheKey(s));
  if (c) { try { return { data: JSON.parse(c) }; } catch (e) {} }
  if (lastData) return { data: Object.assign({}, lastData, { start: ymd(s), events: [] }), loading: true };
  return null;
}
function removePeek(){ weeksBox.querySelectorAll(':scope > .peek').forEach(p => p.remove()); }
function showPeek(n){
  removePeek();
  const p = document.createElement('div');
  p.className = 'peek';
  p.style.left = n > 0 ? 'calc(100% + ' + GAP + 'px)' : 'calc(-100% - ' + GAP + 'px)';
  weeksBox.appendChild(p);
  const nb = neighbor(n);
  if (nb) render(nb.data, nb.loading, p);
}
weeksBox.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) { touch = null; return; }
  const t = e.touches[0];
  touch = { x: t.clientX, y: t.clientY, axis: null, peek: 0 };
}, { passive: true });
weeksBox.addEventListener('touchmove', e => {
  if (!touch) return;
  const t = e.touches[0];
  const dx = t.clientX - touch.x, dy = t.clientY - touch.y;
  if (!touch.axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) touch.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  if (touch.axis !== 'x' || !MOTION) return;
  const dir = dx < 0 ? 1 : -1;
  if (dx && touch.peek !== dir) { touch.peek = dir; showPeek(dir); }
  weeksBox.style.transform = 'translateX(' + dx + 'px)';
}, { passive: true });
function endTouch(e, cancel){
  if (!touch) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touch.x, dy = t.clientY - touch.y;
  const horiz = touch.axis === 'x';
  touch = null;
  const n = !cancel && horiz && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 ? (dx < 0 ? 1 : -1) : 0;
  if (!MOTION || !weeksBox.animate) { weeksBox.style.transform = ''; removePeek(); go(n); return; }
  if (!n) {
    weeksBox.style.transform = '';
    if (horiz) weeksBox.animate([{ transform: 'translateX(' + dx + 'px)' }, { transform: 'none' }], { duration: 160, easing: 'ease-out' }).onfinish = removePeek;
    else removePeek();
    return;
  }
  const out = weeksBox.animate([{ transform: 'translateX(' + dx + 'px)' }, { transform: shiftCss(n) }], { duration: 180, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
  out.onfinish = () => { weeksBox.style.transform = ''; go(n, true); out.cancel(); };
}
weeksBox.addEventListener('touchend', e => endTouch(e, false), { passive: true });
weeksBox.addEventListener('touchcancel', e => endTouch(e, true), { passive: true });

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (shown) render(shown.data, shown.loading); }, 200);
});

load(false);
</script>
